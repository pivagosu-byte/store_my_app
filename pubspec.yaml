name: kit_store_start
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

# Packages
dependencies:
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  flutter:
    sdk: flutter
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


# Local assets

assets:
  - assets/logos/
  - assets/icons/branding/
  - assets/icons/categories/
  - assets/icons/payment_methods/
  - assets/images/animations/
  - assets/images/products/
  - assets/images/banners/
  - assets/images/content/
  - assets/images/on_boarding_images/
  - assets/images/reviews/

# Local fonts

fonts:
  - family: Poppins
    fonts:
      - asset: assets/fonts/coolvetica_regular_italic.otf
        
      - asset: assets/fonts/coolvetica_regular.otf
        
      - asset: assets/fonts/Poppins-Bold.ttf
        weight: 800
      - asset: assets/fonts/Poppins-BoldItalic.ttf
      - asset: assets/fonts/Poppins-Italic.ttf
        style: italic
      - asset: assets/fonts/Poppins-Light.ttf
        weight: 300
      - asset: assets/fonts/Poppins-Medium.ttf
        weight: 500
      - asset: assets/fonts/Poppins-MediumItalic.ttf
        weight: 500
        style: italic
      - asset: assets/fonts/Poppins-Regular.ttf
        weight: 400
      - asset: assets/fonts/Poppins-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Poppins-SemiBoldItalic.ttf        
      - asset: assets/fonts/Poppins-LightItalic.ttf